<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Master Background - Solid Deep Black -->
  <rect width="512" height="512" fill="#050505"/>
  
  <!-- Central Radial Glow for depth -->
  <defs>
    <radialGradient id="masterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#F1C40F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8A6707" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#masterGlow)"/>

  <!-- Musical Staff Lines - Bottom -->
  <g stroke="#D4AF37" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="120" y1="410" x2="392" y2="410" />
    <line x1="100" y1="430" x2="412" y2="430" />
    <line x1="80" y1="450" x2="432" y2="450" />
  </g>

  <!-- Musical Notes - Stylized -->
  <g fill="#D4AF37" opacity="0.9">
    <circle cx="140" cy="410" r="8" />
    <path d="M145 410 V360 Q170 370 170 390 V385 Q170 375 148 365 V410" />
    
    <circle cx="372" cy="410" r="8" />
    <path d="M377 410 V360 Q402 370 402 390 V385 Q402 375 380 365 V410" />
  </g>

  <!-- The Royal 'A' -->
  <g filter="url(#shadow)">
    <path d="M256 80 L440 440 H360 L256 220 L152 440 H72 L256 80 Z" 
          fill="url(#goldGradient)" />
    
    <!-- Crossbar -->
    <rect x="180" y="320" width="152" height="12" rx="6" fill="url(#goldGradient)" />
  </g>

  <!-- The Imperial Crown -->
  <g transform="translate(256, 75) scale(0.9)">
    <path d="M-60 10 H60 L75 -25 L35 -5 L0 -45 L-35 -5 L-75 -25 Z" 
          fill="url(#goldGradient)" 
          stroke="#D4AF37" 
          stroke-width="1.5" />
    
    <!-- Crown Jewels -->
    <circle cx="0" cy="-45" r="5" fill="#FFFFFF" />
    <circle cx="-75" cy="-25" r="4" fill="#FFFFFF" />
    <circle cx="75" cy="-25" r="4" fill="#FFFFFF" />
    <circle cx="0" cy="-5" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
