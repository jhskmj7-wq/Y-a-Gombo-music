<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFRIGOMBO" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AFRIGOMBO ELITE</title>
    <script>
      // Fix for 100vh on mobile browsers
      const setVh = () => {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      };
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);

      // Version tracking without forced reload loops
      const checkVersion = async () => {
        try {
          const res = await fetch(`/version.json?t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.version) {
              localStorage.setItem('afrigombo_app_version', String(data.version));
            }
          }
        } catch (e) {
          console.warn("Could not check version:", e);
        }
      };
      
      checkVersion();

      // Global error logging
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('GLOBAL ERROR:', msg, url, lineNo, columnNo, error);
        return false;
      };
    </script>
  </head>
  <body class="bg-afri-bg text-afri-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
