<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFRIGOMBO" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AFRIGOMBO ELITE</title>
    <script>
      // Fix for 100vh on mobile browsers
      const setVh = () => {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      };
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);

      // Safety Boot Check: Detect if app fails to mount
      window.addEventListener('load', () => {
        console.log("BOOT: Window Loaded");
        
        // Debug Service Worker state
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistration().then(reg => {
            if (reg) {
              console.log("SW STATE:", reg.active ? "ACTIVE" : "PENDING/WAITING", reg.scope);
            } else {
              console.log("SW STATE: NOT REGISTERED");
            }
          });
        }

        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.innerHTML === '') {
            console.error('CRITICAL: App failed to mount after 10 seconds.');
            
            // Log global state to help diagnostics
            console.log("DIAGNOSTICS:", {
              ua: navigator.userAgent,
              href: window.location.href,
              localStorage: Object.keys(localStorage),
              sessionStorage: Object.keys(sessionStorage),
              sw: !!navigator.serviceWorker
            });

            const errorDiv = document.createElement('div');
            errorDiv.id = "startup-recovery-ui";
            errorDiv.style.position = 'fixed';
            errorDiv.style.inset = '0';
            errorDiv.style.backgroundColor = '#050505';
            errorDiv.style.color = '#D4AF37';
            errorDiv.style.display = 'flex';
            errorDiv.style.flexDirection = 'column';
            errorDiv.style.alignItems = 'center';
            errorDiv.style.justifyContent = 'center';
            errorDiv.style.padding = '24px';
            errorDiv.style.textAlign = 'center';
            errorDiv.style.zIndex = '999999';
            errorDiv.style.fontFamily = 'monospace';
            
            errorDiv.innerHTML = `
              <div style="font-size: 48px; margin-bottom: 24px;">🪘</div>
              <div style="font-weight: 900; font-size: 20px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 4px;">SYNC ERROR</div>
              <div style="font-size: 13px; opacity: 0.8; margin-bottom: 32px; max-width: 280px; line-height: 1.6;">
                The Temple failed to open. This usually happens when an old version of the app is stuck in your browser's memory.
              </div>
              <div style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px;">
                <button onclick="window.location.reload(true)" style="background: #D4AF37; color: black; border: none; padding: 16px; border-radius: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">FORCE REFRESH</button>
                <button onclick="if('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(regs => { regs.forEach(r => r.unregister()); localStorage.clear(); sessionStorage.clear(); window.location.reload(true); }); }" style="background: transparent; color: #D4AF37; border: 1px solid rgba(212,175,55,0.3); padding: 12px; border-radius: 16px; font-weight: 600; cursor: pointer; font-size: 11px;">PURGE CACHE & RESET SW</button>
              </div>
              <div style="margin-top: 30px; font-size: 10px; opacity: 0.4;">
                ${new Date().toISOString()}
              </div>
            `;
            document.body.appendChild(errorDiv);
          }
        }, 10000);
      });

      // Global error listener for immediate feedback
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('GLOBAL ERROR:', msg, url, lineNo, columnNo, error);
        return false;
      };
    </script>
  </head>
  <body class="bg-afri-bg text-afri-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
