<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFRIGOMBO" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AFRIGOMBO ELITE</title>
    <script>
      // Fix for 100vh on mobile browsers
      const setVh = () => {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      };
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);

      // Safety Boot Check: Detect if app fails to mount
      window.addEventListener('load', () => {
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.innerHTML === '') {
            console.error('CRITICAL: App failed to mount after 5 seconds. Attempting recovery...');
            const errorDiv = document.createElement('div');
            errorDiv.style.position = 'fixed';
            errorDiv.style.inset = '0';
            errorDiv.style.backgroundColor = '#050505';
            errorDiv.style.color = '#D4AF37';
            errorDiv.style.display = 'flex';
            errorDiv.style.flexDirection = 'column';
            errorDiv.style.alignItems = 'center';
            errorDiv.style.justifyContent = 'center';
            errorDiv.style.padding = '20px';
            errorDiv.style.textAlign = 'center';
            errorDiv.style.zIndex = '99999';
            errorDiv.style.fontFamily = 'monospace';
            
            errorDiv.innerHTML = `
              <div style="font-size: 40px; margin-bottom: 20px;">🪘</div>
              <div style="font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;">AFRIGOMBO ELITE</div>
              <div style="font-size: 12px; opacity: 0.7; margin-bottom: 20px;">Une erreur de synchronisation a été détectée.</div>
              <button onclick="window.location.reload(true)" style="background: #D4AF37; color: black; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer;">ACTUALISER LE TEMPLE</button>
            `;
            document.body.appendChild(errorDiv);
          }
        }, 6000);
      });
    </script>
  </head>
  <body class="bg-afri-bg text-afri-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
