<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFRIGOMBO ELITE" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AFRIGOMBO ELITE</title>
    <style>
      :root {
        --afri-bg: #050505;
        --afri-bg-sec: #111111;
        --afri-text: #FFFFFF;
        --afri-gold: #D4AF37;
        background-color: #050505 !important;
        color: #FFFFFF !important;
      }
      html, body {
        background-color: #050505 !important;
        color: #FFFFFF !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #050505;
      }
      #root:empty::after {
        content: "";
        width: 44px;
        height: 44px;
        border: 3px solid rgba(212, 175, 55, 0.15);
        border-top-color: #D4AF37;
        border-radius: 50%;
        animation: afri-spin 0.8s linear infinite;
      }
      @keyframes afri-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Fix for 100vh on mobile browsers
      const setVh = () => {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      };
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);

      // Automatic recovery if PWA encounters a chunk load error or stale cache error
      const recoverFromChunkError = async (reason) => {
        console.warn('⚠️ [AFRIGOMBO ELITE PWA RECOVERY] Triggered by:', reason);
        const lastRecovery = sessionStorage.getItem('afrigombo_last_pwa_recovery');
        const now = Date.now();
        // Prevent infinite reload loops (limit to once every 10s)
        if (!lastRecovery || (now - parseInt(lastRecovery, 10)) > 10000) {
          sessionStorage.setItem('afrigombo_last_pwa_recovery', String(now));
          if ('serviceWorker' in navigator) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (const reg of registrations) {
                await reg.unregister();
              }
            } catch (e) {}
          }
          if ('caches' in window) {
            try {
              const keys = await caches.keys();
              for (const key of keys) {
                await caches.delete(key);
              }
            } catch (e) {}
          }
          window.location.reload();
        }
      };

      // Catch global errors (script / chunk load failures / SyntaxErrors on 404 js)
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('GLOBAL ERROR:', msg, url, lineNo, columnNo, error);
        const strMsg = String(msg || '').toLowerCase();
        if (
          strMsg.includes('loading chunk') || 
          strMsg.includes('failed to fetch dynamically imported module') || 
          strMsg.includes('script error') ||
          strMsg.includes('unexpected token') ||
          strMsg.includes('syntaxerror')
        ) {
          recoverFromChunkError(msg);
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function(event) {
        const reason = String(event.reason || '').toLowerCase();
        if (reason.includes('loading chunk') || reason.includes('failed to fetch dynamically imported module') || reason.includes('importing a module script failed')) {
          recoverFromChunkError(event.reason);
        }
      });

      // Version tracking
      const checkVersion = async () => {
        try {
          const res = await fetch(`/version.json?t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.version) {
              localStorage.setItem('afrigombo_app_version', String(data.version));
            }
          }
        } catch (e) {
          console.warn("Could not check version:", e);
        }
      };
      
      checkVersion();
    </script>
  </head>
  <body class="bg-afri-bg text-afri-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
