<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFRIGOMBO" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AFRIGOMBO ELITE</title>
    <script>
      // Fix for 100vh on mobile browsers
      const setVh = () => {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      };
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);

      // Auto-recovery Version Sync Logic
      const performSyncAndReload = async () => {
        console.log("🔄 Performing Sync & Clean...");
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) {
              await r.unregister();
            }
          }
          if (window.caches) {
            const names = await caches.keys();
            for (let name of names) {
              await caches.delete(name);
            }
          }
        } catch (e) {
          console.error("Error during sync & clean:", e);
        }
        
        // Save recovery attempt count to prevent infinite loops
        const reloads = parseInt(sessionStorage.getItem('afrigombo_auto_recovery') || '0', 10);
        if (reloads < 3) {
          sessionStorage.setItem('afrigombo_auto_recovery', (reloads + 1).toString());
          window.location.reload(true);
        } else {
          console.error("Max recovery attempts reached. Halting.");
          const errorDiv = document.createElement('div');
          errorDiv.style.position = 'fixed';
          errorDiv.style.inset = '0';
          errorDiv.style.backgroundColor = '#050505';
          errorDiv.style.color = '#D4AF37';
          errorDiv.style.display = 'flex';
          errorDiv.style.alignItems = 'center';
          errorDiv.style.justifyContent = 'center';
          errorDiv.style.zIndex = '999999';
          errorDiv.innerHTML = '<div style="text-align:center;"><div style="font-size:48px;margin-bottom:16px;">🪘</div><div style="font-family:monospace;font-size:12px;opacity:0.6;">ERREUR DE CHARGEMENT. VEUILLEZ RELANCER.</div></div>';
          document.body.appendChild(errorDiv);
        }
      };

      const checkVersion = async () => {
        try {
          const res = await fetch(`/version.json?t=${Date.now()}`);
          const data = await res.json();
          const currentVersion = localStorage.getItem('afrigombo_app_version');
          
          if (currentVersion && currentVersion !== String(data.version)) {
            console.warn("⚠️ Version mismatch detected. Current:", currentVersion, "New:", data.version);
            localStorage.setItem('afrigombo_app_version', String(data.version));
            performSyncAndReload();
            return;
          } else if (!currentVersion) {
            localStorage.setItem('afrigombo_app_version', String(data.version));
          }
        } catch (e) {
          console.warn("Could not check version:", e);
        }
      };
      
      checkVersion();

      // Safety Boot Check: Detect if app fails to mount
      window.addEventListener('load', () => {
        console.log("BOOT: Window Loaded");
        
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.innerHTML === '') {
            console.error('CRITICAL: App failed to mount after 10 seconds. Auto-recovering...');
            performSyncAndReload();
          }
        }, 10000);
      });

      // Global error listener for immediate feedback
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('GLOBAL ERROR:', msg, url, lineNo, columnNo, error);
        return false;
      };
    </script>
  </head>
  <body class="bg-afri-bg text-afri-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
